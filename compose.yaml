name: dexa-wfh-assessment
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run npm run setup first}
      MYSQL_DATABASE: wfh
      MYSQL_USER: wfh_migrate
      MYSQL_PASSWORD: ${MYSQL_MIGRATE_PASSWORD:?Run npm run setup first}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' > /dev/null"]
      interval: 4s
      timeout: 3s
      retries: 30
      start_period: 20s
volumes:
  mysql-data:
